<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">AI 어시스턴트가 아파트 데이터를 조회하는 흐름</title>
<desc id="desc">사용자가 단지 이름으로 질문하면 AI 앱이 MCP 서버의 도구를 골라 단지를 찾고, 실거래·분양·전망 도구로 결과를 받아 답변하는 순서를 보여 주는 설명용 그림. 서버는 로그인 없이 공개 자료만 읽는다.</desc>
<style>
text{font-family:"Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif;fill:#17213c}
.title{font-size:40px;font-weight:700;letter-spacing:-1.2px}
.subtitle{font-size:24px;fill:#52617a}
.label{font-size:26px;font-weight:700}
.body{font-size:21px;fill:#52617a}
.mono{font-family:"SF Mono",Menlo,monospace;font-size:19px;fill:#3b2f8f}
.step{font-size:20px;font-weight:700;fill:#fff}
.note{font-size:20px;fill:#5e6d85}
</style>
<rect width="1000" height="760" rx="28" fill="#f4f5fb"/>
<text x="48" y="76" class="title">질문은 말로, 조회는 도구로</text>
<text x="48" y="119" class="subtitle">AI 앱이 필요한 도구를 골라 공개 자료를 읽은 뒤 답합니다.</text>

<!-- user question -->
<rect x="40" y="156" width="920" height="96" rx="20" fill="#fff" stroke="#e1e5ef"/>
<circle cx="88" cy="204" r="20" fill="#17213c"/><text x="81" y="211" class="step">1</text>
<text x="128" y="196" class="label">질문</text>
<text x="128" y="230" class="body">“OO구 OO아파트 84㎡ 최근 실거래 10건과 1년 뒤 전망 알려줘”</text>

<path d="M500 252v26" stroke="#9aa3b8" stroke-width="3"/><path d="M490 270l10 12 10-12" fill="none" stroke="#9aa3b8" stroke-width="3"/>

<!-- AI app -->
<rect x="40" y="288" width="920" height="96" rx="20" fill="#fff" stroke="#e1e5ef"/>
<circle cx="88" cy="336" r="20" fill="#17213c"/><text x="81" y="343" class="step">2</text>
<text x="128" y="328" class="label">AI 앱 (Claude · ChatGPT · Claude Code)</text>
<text x="128" y="362" class="body">단지 이름으로 먼저 검색하고, 여러 지역에 있으면 지역을 되묻습니다.</text>

<path d="M500 384v26" stroke="#9aa3b8" stroke-width="3"/><path d="M490 402l10 12 10-12" fill="none" stroke="#9aa3b8" stroke-width="3"/>

<!-- MCP tools -->
<rect x="40" y="420" width="920" height="196" rx="20" fill="#ece9fb" stroke="#cfc7f4"/>
<circle cx="88" cy="468" r="20" fill="#5840c4"/><text x="81" y="475" class="step">3</text>
<text x="128" y="460" class="label">MCP 서버의 도구 호출</text>
<text x="128" y="494" class="body">로그인·API 키 없이 공개 자료만 읽습니다.</text>
<rect x="128" y="516" width="250" height="78" rx="14" fill="#fff" stroke="#d9d3f6"/>
<text x="146" y="548" class="label" style="font-size:21px">단지 찾기</text>
<text x="146" y="578" class="mono">search_apartments</text>
<rect x="398" y="516" width="250" height="78" rx="14" fill="#fff" stroke="#d9d3f6"/>
<text x="416" y="548" class="label" style="font-size:21px">분양 공고</text>
<text x="416" y="578" class="mono">search_presales</text>
<rect x="668" y="516" width="250" height="78" rx="14" fill="#fff" stroke="#d9d3f6"/>
<text x="686" y="548" class="label" style="font-size:21px">가격 전망</text>
<text x="686" y="578" class="mono">get_forecast</text>

<path d="M500 616v26" stroke="#9aa3b8" stroke-width="3"/><path d="M490 634l10 12 10-12" fill="none" stroke="#9aa3b8" stroke-width="3"/>

<rect x="40" y="652" width="920" height="72" rx="20" fill="#fff" stroke="#e1e5ef"/>
<circle cx="88" cy="688" r="20" fill="#17213c"/><text x="81" y="695" class="step">4</text>
<text x="128" y="697" class="label">기준일·면적·범위를 함께 적은 답변</text>
</svg>
